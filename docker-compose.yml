services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodauto
      POSTGRES_USER: goodauto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 호스트에서 접속용 (로컬 개발·백업 점검). 기본은 127.0.0.1에만 바인드해 외부에 PostgreSQL을 노출하지 않는다.
      # web/migrate 컨테이너는 내부 네트워크(db:5432)로 접속하므로 이 포트가 없어도 동작한다.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-12002}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodauto -d goodauto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 일회성: DB 스키마 반영 + 시드 후 종료
  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_PORTONE_STORE_ID: ${NEXT_PUBLIC_PORTONE_STORE_ID:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CHANNEL_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://goodauto:${POSTGRES_PASSWORD}@db:5432/goodauto
      SEED_ON_START: ${SEED_ON_START:-true}
      # 시드 관리자 초기 비밀번호 — 기본값 없음 (추측 가능한 기본 비밀번호 금지)
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # 시드 관리자 휴대폰 번호 — 관리자 로그인 2단계 인증 문자 수신
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:-}
    command: >
      sh -c "npx prisma db push --skip-generate &&
             if [ \"$$SEED_ON_START\" = \"true\" ]; then node prisma/seed.js; fi"
    restart: "no"

  web:
    build:
      context: .
      # 포트원 공개 키는 빌드 시 클라이언트 번들에 포함되므로 build arg로 전달 (값 변경 시 --build 필요)
      args:
        NEXT_PUBLIC_PORTONE_STORE_ID: ${NEXT_PUBLIC_PORTONE_STORE_ID:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CHANNEL_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://goodauto:${POSTGRES_PASSWORD}@db:5432/goodauto
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET을 .env에 설정하세요}
      AUTH_TRUST_HOST: "true"
      # 로그아웃·인증 리다이렉트 기준 주소. 미설정 시 localhost로 리다이렉트되므로 필수
      AUTH_URL: "${AUTH_URL:?AUTH_URL을 .env에 서비스 도메인(예 https://optix.goodautosys.kr)으로 설정하세요}"
      PROGRAM_JWT_SECRET: ${PROGRAM_JWT_SECRET:?PROGRAM_JWT_SECRET을 .env에 설정하세요}
      NEXT_PUBLIC_PORTONE_STORE_ID: ${NEXT_PUBLIC_PORTONE_STORE_ID}
      NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CHANNEL_KEY}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      # 포트원 웹훅 서명 검증 시크릿 (포트원 콘솔 > 결제 연동 > 웹훅)
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET:-}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER: ${SOLAPI_SENDER:-}
      # 보안 알림 문자 수신 번호 (관리자 로그인·계정 잠금·결제 금액 불일치 등). 비우면 사이트 대표번호
      SECURITY_ALERT_PHONE: ${SECURITY_ALERT_PHONE:-}
    volumes:
      # 프로그램 설치 파일: 호스트에서 교체하면 재빌드 없이 반영
      - ./private-files:/app/private-files:ro
    ports:
      # nginx가 이 포트로 프록시한다. 외부에서 직접 접근하면 nginx를 우회해 X-Real-IP 위조로
      # 로그인 시도 제한 등을 피할 수 있으므로, 방화벽으로 nginx만 접근하도록 막거나
      # 호스트에 설치된 nginx라면 WEB_BIND=127.0.0.1로 설정하세요.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-12000}:3000"

volumes:
  pgdata:
