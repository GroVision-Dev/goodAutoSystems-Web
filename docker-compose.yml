services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodauto
      POSTGRES_USER: goodauto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 로컬 개발 시 호스트에서 접속용 (운영서버에서 외부 노출이 필요 없으면 제거)
      - "${DB_PORT:-12002}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodauto -d goodauto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 일회성: DB 스키마 반영 + 시드 후 종료
  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_PORTONE_STORE_ID: ${NEXT_PUBLIC_PORTONE_STORE_ID:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CHANNEL_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://goodauto:${POSTGRES_PASSWORD}@db:5432/goodauto
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-optixdev1234}
    command: >
      sh -c "npx prisma db push --skip-generate &&
             if [ \"$$SEED_ON_START\" = \"true\" ]; then node prisma/seed.js; fi"
    restart: "no"

  web:
    build:
      context: .
      # 포트원 공개 키는 빌드 시 클라이언트 번들에 포함되므로 build arg로 전달 (값 변경 시 --build 필요)
      args:
        NEXT_PUBLIC_PORTONE_STORE_ID: ${NEXT_PUBLIC_PORTONE_STORE_ID:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CHANNEL_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://goodauto:${POSTGRES_PASSWORD}@db:5432/goodauto
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET을 .env에 설정하세요}
      AUTH_TRUST_HOST: "true"
      # 로그아웃·인증 리다이렉트 기준 주소. 미설정 시 localhost로 리다이렉트되므로 필수
      AUTH_URL: "${AUTH_URL:?AUTH_URL을 .env에 서비스 도메인(예 https://optix.goodautosys.kr)으로 설정하세요}"
      PROGRAM_JWT_SECRET: ${PROGRAM_JWT_SECRET:?PROGRAM_JWT_SECRET을 .env에 설정하세요}
      NEXT_PUBLIC_PORTONE_STORE_ID: ${NEXT_PUBLIC_PORTONE_STORE_ID}
      NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CHANNEL_KEY}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER: ${SOLAPI_SENDER:-}
    volumes:
      # 프로그램 설치 파일: 호스트에서 교체하면 재빌드 없이 반영
      - ./private-files:/app/private-files:ro
    ports:
      - "${WEB_PORT:-12000}:3000"

volumes:
  pgdata:
