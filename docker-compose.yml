services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodauto
      POSTGRES_USER: goodauto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 로컬 개발 시 호스트에서 접속용 (운영서버에서 외부 노출이 필요 없으면 제거)
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodauto -d goodauto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 일회성: DB 스키마 반영 + 시드 후 종료
  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://goodauto:${POSTGRES_PASSWORD}@db:5432/goodauto
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234!}
    command: >
      sh -c "npx prisma db push --skip-generate &&
             if [ \"$$SEED_ON_START\" = \"true\" ]; then node prisma/seed.js; fi"
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://goodauto:${POSTGRES_PASSWORD}@db:5432/goodauto
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET을 .env에 설정하세요}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      PROGRAM_JWT_SECRET: ${PROGRAM_JWT_SECRET:?PROGRAM_JWT_SECRET을 .env에 설정하세요}
      NEXT_PUBLIC_TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # 프로그램 설치 파일: 호스트에서 교체하면 재빌드 없이 반영
      - ./private-files:/app/private-files:ro
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
