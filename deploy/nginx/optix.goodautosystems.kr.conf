# optix.goodautosystems.kr → goodAutoSystems-Web (docker compose, 호스트 포트 12000)
#
# 배치 위치 예: nginx 컨테이너의 conf.d/ 또는 sites-enabled/ 에 이 파일 그대로.
# 인증서는 goodautosystems.kr 용으로 별도 발급 필요 (아래 certbot 절차 참고).
#
# upstream 주소는 nginx 실행 방식에 따라 하나만 선택:
#   - nginx가 Docker 컨테이너:  http://host.docker.internal:12000
#       (Linux에서는 nginx 컨테이너에 extra_hosts: ["host.docker.internal:host-gateway"] 필요)
#   - nginx가 호스트에 직접 설치: http://127.0.0.1:12000

upstream optix_web {
    server host.docker.internal:12000;
    # server 127.0.0.1:12000;   # 호스트 nginx일 때
}

# HTTP → HTTPS 리다이렉트 (+ Let's Encrypt HTTP-01 검증 경로)
server {
    listen 80;
    server_name optix.goodautosystems.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name optix.goodautosystems.kr;

    ssl_certificate     /etc/letsencrypt/live/optix.goodautosystems.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optix.goodautosystems.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    # Next.js 전체 (페이지·API·정적파일 모두 앱이 처리)
    location / {
        proxy_pass http://optix_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # 빌드 산출물은 파일명에 해시가 있어 장기 캐시 가능
    location /_next/static/ {
        proxy_pass http://optix_web;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
