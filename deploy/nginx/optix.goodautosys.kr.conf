# optix.goodautosys.kr → goodAutoSystems-Web (docker compose, 호스트 포트 12000)
#
# 배치 위치 예: nginx 컨테이너의 conf.d/ 또는 sites-enabled/ 에 이 파일 그대로.
# (conf.d 파일은 http {} 안에 include되므로 아래 map·limit_req_zone을 파일 상단에 둘 수 있다)
# 인증서는 goodautosys.kr 용으로 별도 발급 필요.
#
# upstream 주소는 nginx 실행 방식에 따라 하나만 선택:
#   - nginx가 Docker 컨테이너:  http://host.docker.internal:12000
#       (Linux에서는 nginx 컨테이너에 extra_hosts: ["host.docker.internal:host-gateway"] 필요)
#   - nginx가 호스트에 직접 설치: http://127.0.0.1:12000  (이때 .env에 WEB_BIND=127.0.0.1 권장)
#
# 보안 패치 정책:
#   - nginx 보안 권고(https://nginx.org/en/security_advisories.html)를 월 1회 확인한다
#   - 패키지 설치: apt/dnf로 업데이트, Docker: 공식 이미지 태그(nginx:stable / nginx:mainline)를 새로 pull 후 재기동
#   - 현재 버전 확인: `nginx -v` (컨테이너면 `docker exec <nginx> nginx -v`)
#   - 버전 노출 방지: 이 파일의 server_tokens off 외에 메인 nginx.conf의 http {} 에도 `server_tokens off;` 를 넣을 것

upstream optix_web {
    server host.docker.internal:12000;
    # server 127.0.0.1:12000;   # 호스트 nginx일 때
}

# ---------- 요청 제한 (대량 요청·무차별 대입 1차 방어, 앱에도 별도 제한 있음) ----------
# POST 요청만 제한한다 (키가 빈 문자열이면 제한 대상에서 제외된다)
map $request_method $optix_post_limit_key {
    POST    $binary_remote_addr;
    default "";
}

# 로그인·회원가입·인증문자·아이디 중복확인 (/api/auth/*)
limit_req_zone $optix_post_limit_key zone=optix_auth:10m rate=10r/m;
# 데스크톱 프로그램 로그인
limit_req_zone $optix_post_limit_key zone=optix_program_login:10m rate=10r/m;
# 도입 문의 접수
limit_req_zone $optix_post_limit_key zone=optix_inquiry:10m rate=5r/m;

# HTTP → HTTPS 리다이렉트 (+ Let's Encrypt HTTP-01 검증 경로)
server {
    listen 80;
    server_name optix.goodautosys.kr;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name optix.goodautosys.kr;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/optix.goodautosys.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optix.goodautosys.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 업로드 기능이 없으므로 요청 본문은 작게 제한 (서버 액션 기본 한도 1MB)
    client_max_body_size 2m;
    limit_req_status 429;

    # ---------- 프록시 공통 (location에서 proxy_set_header를 새로 쓰지 않으면 그대로 상속) ----------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 클라이언트가 보낸 X-Forwarded-For/X-Real-IP 값은 버리고 실제 접속 IP로 덮어쓴다
    # (앱은 이 값으로 로그인 시도 제한·접속기록을 남긴다)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;

    # HSTS는 TLS를 종료하는 nginx에서 붙인다 (앱이 붙인 헤더는 중복 방지를 위해 숨김)
    # 주의: add_header는 location 안에 add_header가 하나라도 있으면 server 수준 값이 상속되지 않는다.
    #       add_header를 쓰는 location에는 HSTS를 다시 적어야 한다.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 숨김 파일(.git, .env 등) 접근 차단 — .well-known은 허용
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # 포트원 웹훅 — 서명으로 검증하며, 재시도 누락을 막기 위해 요청 제한을 걸지 않는다
    location = /api/webhooks/portone {
        proxy_pass http://optix_web;
    }

    location /api/auth/ {
        limit_req zone=optix_auth burst=10 nodelay;
        proxy_pass http://optix_web;
    }

    location = /api/program/login {
        limit_req zone=optix_program_login burst=5 nodelay;
        proxy_pass http://optix_web;
    }

    location = /api/inquiries {
        limit_req zone=optix_inquiry burst=3 nodelay;
        proxy_pass http://optix_web;
    }

    # Next.js 전체 (페이지·API·정적파일 모두 앱이 처리)
    location / {
        proxy_pass http://optix_web;
    }

    # 빌드 산출물은 파일명에 해시가 있어 장기 캐시 가능
    location /_next/static/ {
        proxy_pass http://optix_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
